  <title id="title">Mukundara landscape illustration</title>
  <desc id="desc">A stylized Mukundara landscape with ridges, a Chambal-like river valley, plateau, scrub and grassland.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#d9eaee"/>
