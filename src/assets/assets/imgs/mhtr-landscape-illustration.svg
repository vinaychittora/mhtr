      <stop offset="1" stop-color="#9d7740"/>
    </linearGradient>
    <linearGradient id="scrub" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#76916a"/>
      <stop offset="1" stop-color="#3d6748"/>
    </linearGradient>
    <linearGradient id="river" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d9eaee"/>
      <stop offset="0.52" stop-color="#6fb0bb"/>
      <stop offset="1" stop-color="#326f78"/>
    </linearGradient>
